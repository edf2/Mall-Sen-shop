server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    druid:
      driver-class-name: ${mallsen.datasource.driver-class-name}
      url: jdbc:mysql://${mallsen.datasource.host}:${mallsen.datasource.port}/${mallsen.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${mallsen.data.redis.host}
      port: ${mallsen.data.redis.port}
      database: ${mallsen.data.redis.database}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mallsen.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      mallsen:
        mapper: debug
        service: info
        controller: info

mallsen:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${JWT_ADMIN_SECRET_KEY}
    # 设置jwt过期时间
    admin-ttl: 720000000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: ${JWT_USER_SECRET_KEY}
    # 设置jwt过期时间
    user-ttl: 720000000
    # 设置前端传递过来的令牌名称
    user-token-name: authentication
  alioss:
    endpoint: ${mallsen.alioss.endpoint}
    access-key-id: ${mallsen.alioss.access-key-id}
    access-key-secret: ${mallsen.alioss.access-key-secret}
    bucket-name: ${mallsen.alioss.bucket-name}
  upload:
    local-path: ${UPLOAD_LOCAL_PATH:./uploads}
    url-prefix: ${UPLOAD_URL_PREFIX:/upload}
    max-size: ${UPLOAD_MAX_SIZE:10485760}
    use-local: ${UPLOAD_USE_LOCAL:true}
    server-url: ${UPLOAD_SERVER_URL:http://localhost:8080}
  wechat:
    appid: ${mallsen.wechat.appid}
    secret: ${mallsen.wechat.secret}
  baidu:
    ak: ${mallsen.baidu.ak}
  shop:
    address: ${mallsen.shop.address}

agent:
  service:
    url: http://localhost:8100
    # 与 Python Agent 服务的内部鉴权密钥，必须与 Agent 的 AGENT_API_KEY 一致
    api-key: ${AGENT_API_KEY:change-me}
