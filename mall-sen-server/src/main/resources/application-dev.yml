mallsen:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:mall-sen-shop}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  alioss:
    endpoint: ${ALIOSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIOSS_BUCKET_NAME:sky-studytoedf}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  wechat:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}
    notify-url: http://6ce815aa.r5.cpolar.top/notify/paySuccess
    refund-notify-url: http://6ce815aa.r5.cpolar.top/notify/refundSuccess
  baidu:
    ak: ${BAIDU_AK}
  shop:
    address: 湖南省常德市鼎城区湖南应用技术学院